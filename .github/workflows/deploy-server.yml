name: Deploy to the forum server

# Fill these in once, at
#   Settings -> Secrets and variables -> Actions
#
#   Variables:  SSH_HOST, SSH_USER, DEPLOY_PATH, SITE_URL, SSH_PORT (optional)
#   Secrets:    SSH_KEY (the private key), SSH_KNOWN_HOSTS (ssh-keyscan output)
#
# The server side is server/.env — see server/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one that has started: half an rsync
# is a site that is half of two builds.
concurrency:
  group: forum-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No server configured yet, or a fork: nothing to deploy to.
    if: vars.SSH_HOST != '' && github.repository == 'fastsoftware-uz/web2'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_REGISTER_ENDPOINT: ${{ vars.REGISTER_ENDPOINT }}

      # The key never reaches a command line, and the host key is pinned:
      # StrictHostKeyChecking with nothing to check against is a deploy that
      # trusts whatever answers on that address.
      - name: Key and known host
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The built site. --delete, because a renamed asset must not linger;
      # data/ is included on purpose — it is the base the admin's overlay is
      # re-applied to two steps below.
      #
      # D2775 rather than D755: public/data is the one directory inside the
      # web root that PHP-FPM has to write, it is group-writable and setgid
      # for exactly that reason, and a deploy that resets it to 755 is a
      # deploy after which the site editor can no longer save.
      - name: Upload the site
        env:
          HOST: ${{ vars.SSH_HOST }}
          USER: ${{ vars.SSH_USER }}
          PORT: ${{ vars.SSH_PORT || '22' }}
          BASE: ${{ vars.DEPLOY_PATH }}
        run: |
          rsync -rlptz --delete --chmod=D2775,F664 \
            -e "ssh -i ~/.ssh/id_deploy -p $PORT -o StrictHostKeyChecking=yes" \
            dist/ "$USER@$HOST:$BASE/public/"

      # The backend. .env is the installation's own configuration and data/ is
      # the registrations: both are excluded, which also protects them from
      # --delete.
      - name: Upload the backend
        env:
          HOST: ${{ vars.SSH_HOST }}
          USER: ${{ vars.SSH_USER }}
          PORT: ${{ vars.SSH_PORT || '22' }}
          BASE: ${{ vars.DEPLOY_PATH }}
        run: |
          rsync -rlptz --delete --chmod=D2775,F664 \
            --exclude '.env' --exclude 'data/' \
            -e "ssh -i ~/.ssh/id_deploy -p $PORT -o StrictHostKeyChecking=yes" \
            server/ "$USER@$HOST:$BASE/server/"

      # Put the organiser's own edits back on top of the new build, and then
      # say out loud whether this installation is actually in a state to run.
      - name: Republish the admin's edits
        env:
          HOST: ${{ vars.SSH_HOST }}
          USER: ${{ vars.SSH_USER }}
          PORT: ${{ vars.SSH_PORT || '22' }}
          BASE: ${{ vars.DEPLOY_PATH }}
        run: |
          # Alpine installs /usr/bin/php84 and often no plain `php` at all,
          # so the remote shell is asked which one it has rather than told.
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes \
            "$USER@$HOST" \
            "PHP=\$(command -v php || command -v php84); \
             \$PHP '$BASE/server/bin/publish.php' && \$PHP '$BASE/server/bin/doctor.php'"

      - name: Health check
        if: vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: curl -fsS --retry 5 --retry-delay 3 "$SITE_URL/api/health"
