name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 22, and it has to stay in step with whatever writes
          # the lockfile below.
          #
          # This file regenerates package-lock.json with the developer's own
          # npm whenever a dependency range changes. npm 11 — Node 24 — writes
          # a lock that npm 10 — Node 22 — then refuses:
          #
          #   npm error Missing: @emnapi/runtime@2.0.0-beta.2 from lock file
          #
          # which is a deploy that fails at npm ci having built nothing. The
          # two have to agree, so the runner follows the development runtime.
          node-version: 24
          cache: npm
      - name: Install
        id: install
        run: npm ci --no-audit --no-fund
        continue-on-error: true
      # Temporary: the runner's npm log is not readable without a token, so
      # a failure is copied into the job summary, which is public.
      - name: Why the install failed
        if: steps.install.outcome == 'failure'
        run: |
          {
            echo '### npm ci failed'
            echo ''
            echo 'node: ' "$(node -v)" '  npm: ' "$(npm -v)"
            echo ''
            echo '```'
            tail -n 150 "$(ls -t ~/.npm/_logs/*.log | head -1)" || echo 'no npm log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - run: npm run build
        env:
          VITE_REGISTER_ENDPOINT: ${{ vars.REGISTER_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
