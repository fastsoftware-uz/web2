<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />

    <title>Roʻyxatdan oʻtish — Tourism Investment Forum 2026</title>
    <meta
      name="description"
      content="Birinchi xalqaro turizm investitsiya forumi, Toshkent, 25–27 noyabr 2026. Roʻyxatdan oʻtish forumning rasmiy roʻyxat sahifasida."
    />

    <!-- `../`: this page is served as a directory — /register/ rather than
         /register.html — so a relative path resolves inside it, not beside
         the site root where these files are. -->
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <meta name="theme-color" content="#1D3577" />

    <!--
      This page used to be the site's registration form, its own Vite entry
      with components/RegisterForm.vue inside it. On 18 November 2026 the
      organiser asked for the site to stop taking registrations and to send
      people to the forum's own registration page instead.

      It is a forwarding page rather than a deleted one: the address has been
      printed, sent and linked to, and a link that has been given out should
      land somewhere rather than on a 404.

      Nothing is bundled here any more — the form, Vue and the rest are gone
      from this entry, which is why the forwarding is written inline. The
      address comes out of the same data file the site reads, so the operator
      can change it from the admin; the one built in is used if the file is
      slow, missing or older than this page.
    -->
    <meta name="robots" content="noindex, follow" />

    <style>
      /* The page's own ground: it is on screen for a moment at most, and a
         white flash before a dark page is the whole of what a visitor would
         remember of it. */
      html {
        background: #1d3577;
        color: #f4ecdd;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }
      p {
        max-width: 32rem;
        line-height: 1.6;
      }
      a {
        color: #e4bb7d;
      }
    </style>
  </head>
  <body>
    <main>
      <p>
        Roʻyxatdan oʻtish forumning rasmiy roʻyxat sahifasida olib boriladi.
        Yoʻnaltirilmoqda…
      </p>
      <p>
        <a id="go" href="https://titf.uz/en/online-registration">
          Roʻyxatdan oʻtish sahifasini ochish
        </a>
      </p>
    </main>

    <script>
      (function () {
        var fallback = 'https://titf.uz/en/online-registration';
        var sent = false;

        function safe(url) {
          /* Only http(s). The address travels through the admin, and a
             `javascript:` one written into `href` is the way a text field in
             an operator's form turns into script running on this page. */
          return typeof url === 'string' && /^https?:\/\//i.test(url) ? url : null;
        }

        function go(url) {
          if (sent) return;
          sent = true;
          var target = safe(url) || fallback;
          document.getElementById('go').href = target;
          location.replace(target);
        }

        /* The data file, if it answers quickly; otherwise the address this
           page was built with. Either way the reader is not left reading a
           sentence that says they are being forwarded. */
        var timer = setTimeout(function () {
          go(fallback);
        }, 1500);

        try {
          fetch('../data/forum-2026.json', { cache: 'no-cache' })
            .then(function (res) {
              return res.ok ? res.json() : null;
            })
            .then(function (data) {
              clearTimeout(timer);
              go(data && data.registration && data.registration.url);
            })
            .catch(function () {
              clearTimeout(timer);
              go(fallback);
            });
        } catch (e) {
          clearTimeout(timer);
          go(fallback);
        }
      })();
    </script>

    <noscript>
      <meta http-equiv="refresh" content="0; url=https://titf.uz/en/online-registration" />
    </noscript>
  </body>
</html>
